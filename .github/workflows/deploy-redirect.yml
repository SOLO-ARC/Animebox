name: Deploy GitHub Pages Redirect to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Redirect Site
        run: |
          mkdir -p redirect-site
          cat << 'EOF' > redirect-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://appanimebox.netlify.app/" />
            <script>window.location.replace("https://appanimebox.netlify.app/");</script>
            <title>Redirecting to AnimeBox...</title>
            <style>
              body { background: #000; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
              a { color: #a855f7; text-decoration: underline; font-weight: bold; }
            </style>
          </head>
          <body>
            <div>
              <h2>Redirecting to AnimeBox...</h2>
              <p>If you are not redirected automatically, <a href="https://appanimebox.netlify.app/">click here to open AnimeBox</a>.</p>
            </div>
          </body>
          </html>
          EOF
          cp redirect-site/index.html redirect-site/404.html
          touch redirect-site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './redirect-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
