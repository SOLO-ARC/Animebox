<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://appanimebox.netlify.app/" />
  <script>window.location.replace("https://appanimebox.netlify.app/");</script>
  <title>AnimeBox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap { padding: 2rem; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 1.5rem; border-radius: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
    p  { font-size: .9rem; color: rgba(255,255,255,.55); margin-bottom: 1.5rem; }
    a  {
      display: inline-block;
      background: #fff;
      color: #000;
      font-weight: 600;
      font-size: .9rem;
      padding: .65rem 1.6rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: opacity .15s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://appanimebox.netlify.app/logo.png" alt="AnimeBox logo" />
    <h1>AnimeBox</h1>
    <p>Redirecting you to the AnimeBox website&hellip;</p>
    <a href="https://appanimebox.netlify.app/">Open AnimeBox &rarr;</a>
  </div>
</body>
</html>
