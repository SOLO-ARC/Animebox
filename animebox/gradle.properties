# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with modern multi-threaded G1GC and ample RAM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# Enable parallel execution across all CPU cores
org.gradle.parallel=true

# File system watching for fast incremental changes detection
org.gradle.vfs.watch=true

# Caching & configuration cache
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin incremental compilation optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Android build settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Compiling with Java 8 is deprecated but we still use it for now
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
